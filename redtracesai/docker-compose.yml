services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redtracesai
      POSTGRES_USER: redtraces
      POSTGRES_PASSWORD: redtraces
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redtraces -d redtracesai"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://redtraces:redtraces@postgres:5432/redtracesai
      FRONTEND_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  reddit_collector:
    build: .
    command: python -m collectors.reddit_collector
    environment:
      DATABASE_URL: postgresql+asyncpg://redtraces:redtraces@postgres:5432/redtracesai
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-redtracesai/0.1}
      REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-netsec,cybersecurity,blackhat}
      REDDIT_DISCOVERY_ENABLED: ${REDDIT_DISCOVERY_ENABLED:-true}
      REDDIT_MAX_SUBREDDITS: ${REDDIT_MAX_SUBREDDITS:-20}
      CTI_KEYWORDS: ${CTI_KEYWORDS:-ransomware,CVE,zero-day,0day,exploit,botnet,stealer,infostealer,malware,data leak,breach,initial access,access broker,phishing}
      CTI_FILTER_CONTENT: ${CTI_FILTER_CONTENT:-true}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  telegram_collector:
    build: .
    command: python -m collectors.telegram_collector
    environment:
      DATABASE_URL: postgresql+asyncpg://redtraces:redtraces@postgres:5432/redtracesai
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_CHANNELS: ${TELEGRAM_CHANNELS:-}
      TELEGRAM_SESSION: /app/sessions/redtracesai
      TELEGRAM_DISCOVERY_ENABLED: ${TELEGRAM_DISCOVERY_ENABLED:-true}
      TELEGRAM_AUTO_JOIN: ${TELEGRAM_AUTO_JOIN:-true}
      TELEGRAM_MAX_CHANNELS: ${TELEGRAM_MAX_CHANNELS:-20}
      CTI_KEYWORDS: ${CTI_KEYWORDS:-ransomware,CVE,zero-day,0day,exploit,botnet,stealer,infostealer,malware,data leak,breach,initial access,access broker,phishing}
      CTI_FILTER_CONTENT: ${CTI_FILTER_CONTENT:-true}
    volumes:
      - telegram_session:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  tor:
    image: dockurr/tor:latest
    environment:
      PASSWORD: ${TOR_CONTROL_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:9050:9050"
    expose:
      - "9051"
    restart: unless-stopped
  darkweb_collector:
    build: .
    command: python -m collectors.darkweb_collector
    environment:
      DATABASE_URL: postgresql+asyncpg://redtraces:redtraces@postgres:5432/redtracesai
      DARKWEB_TARGETS: ${DARKWEB_TARGETS:-}
      DARKWEB_CRAWL_DELAY_SECONDS: ${DARKWEB_CRAWL_DELAY_SECONDS:-10}
      DARKWEB_POLL_INTERVAL_SECONDS: ${DARKWEB_POLL_INTERVAL_SECONDS:-300}
      DARKWEB_REQUEST_TIMEOUT_SECONDS: ${DARKWEB_REQUEST_TIMEOUT_SECONDS:-45}
      DARKWEB_RETRY_ATTEMPTS: ${DARKWEB_RETRY_ATTEMPTS:-4}
      DARKWEB_MAX_DEPTH: ${DARKWEB_MAX_DEPTH:-2}
      DARKWEB_MAX_PAGES_PER_TARGET: ${DARKWEB_MAX_PAGES_PER_TARGET:-100}
      DARKWEB_USER_AGENT: ${DARKWEB_USER_AGENT:-redtracesai-research/0.1}
      CTI_KEYWORDS: ${CTI_KEYWORDS:-ransomware,CVE,zero-day,0day,exploit,botnet,stealer,infostealer,malware,data leak,breach,initial access,access broker,phishing}
      CTI_FILTER_CONTENT: ${CTI_FILTER_CONTENT:-true}
      TOR_SOCKS_PROXY: socks5h://tor:9050
      TOR_CONTROL_HOST: tor
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  postgres_data:
  telegram_session:
